name: Scientific and frontend checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[aer,dev]'
      - run: python -m pip check
      # The API tests assert that the server serves the built workbench (web/dist is not committed),
      # so the frontend is built before pytest runs.
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web run build
      - run: python -m pytest tests -q
      - name: Deterministic Aer execution smoke
        run: python -m scripts.aer_smoke
