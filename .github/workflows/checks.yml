name: Scientific and frontend checks
on: [push, pull_request, workflow_dispatch]

# Read-only token: the workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned until a newer runner image has been tested with this project.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - run: python -m pip check
      # The API tests assert that the server serves the built workbench (web/dist is not committed),
      # so the frontend is built before pytest runs.
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - name: Guided stage and duplicate-admission regressions
        run: node --test tests/guided-session.test.mjs
      - run: npm --prefix web run build
      - run: python -m pytest tests -q
      - name: Deterministic Aer execution smoke
        run: python -m scripts.aer_smoke

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Python dependencies and Chromium
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Real server, real Aer investigation, verified export
        env:
          QFAULT_ARTIFACTS: ${{ runner.temp }}/qfault-artifacts
        run: |
          python -m qfault serve --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          python -m scripts.release_smoke --base http://127.0.0.1:8000 --out "$RUNNER_TEMP/smoke"
          python -m scripts.guided_demo_e2e --base http://127.0.0.1:8000 --out "$RUNNER_TEMP/guided"
          python -m scripts.guided_accessibility_e2e --base http://127.0.0.1:8000 --out "$RUNNER_TEMP/guided-accessibility"
      - name: Server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
